<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Octillion: UFC rare-answer trivia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap">
    <style>
        :root {
            --sh: #dff1f2;
            --dp: #8ec1cb;
            --fg: #072a36;
            --mut: #3f6571;
            --card: #ffffffb8;
            --line: #8fb5bd;
            --acc: #0c4a5e;
            --onacc: #fff;
            --t0: #5b6b73;
            --t1: #1f8a5a;
            --t2: #1c70b0;
            --t3: #7a3fb8;
            --t4: #c4670a;
            --t5: #c8102e;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --sh: #0d3a4c;
                --dp: #020b11;
                --fg: #e8f4f6;
                --mut: #9bbcc6;
                --card: #ffffff14;
                --line: #2c5666;
                --acc: #ffb703;
                --onacc: #06212c;
                --t0: #9aa9b0;
                --t1: #5fd39b;
                --t2: #62b6f0;
                --t3: #bb8cf5;
                --t4: #ffa04d;
                --t5: #ff5c75;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --sh: #0d3a4c;
            --dp: #020b11;
            --fg: #e8f4f6;
            --mut: #9bbcc6;
            --card: #ffffff14;
            --line: #2c5666;
            --acc: #ffb703;
            --onacc: #06212c;
            --t0: #9aa9b0;
            --t1: #5fd39b;
            --t2: #62b6f0;
            --t3: #bb8cf5;
            --t4: #ffa04d;
            --t5: #ff5c75;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--fg);
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--sh);
            background: color-mix(in srgb, var(--dp) calc(var(--d, 0)*100%), var(--sh));
            transition: background .9s
        }

        main {
            max-width: 620px;
            margin: 0 auto;
            padding: 22px 16px 48px
        }

        h1,
        h2,
        .big {
            font-family: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
            font-weight: 800;
            margin: 0;
            line-height: 1
        }

        h1 {
            font-size: clamp(72px, 24vw, 132px);
            letter-spacing: .01em
        }

        h2 {
            font-size: clamp(30px, 8vw, 40px);
            line-height: 1.08;
            margin: 6px 0 16px
        }

        .big {
            font-size: 32px
        }

        .mut {
            color: var(--mut)
        }

        .card {
            background: var(--card);
            padding: 22px 24px;
            margin: 16px 0;
            --k: 16px;
            clip-path: polygon(var(--k) 0, calc(100% - var(--k)) 0, 100% var(--k), 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, var(--k) 100%, 0 calc(100% - var(--k)), 0 var(--k))
        }

        .card p {
            margin: 0 0 12px
        }

        button {
            font: inherit;
            font-weight: 700;
            border: 0;
            border-radius: 10px;
            padding: 14px 24px;
            background: var(--acc);
            color: var(--onacc);
            cursor: pointer
        }

        button.ghost {
            background: transparent;
            color: var(--fg);
            border: 2px solid var(--line)
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--t2);
            outline-offset: 2px
        }

        input {
            font: inherit;
            font-size: 18px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid var(--line);
            background: transparent;
            color: var(--fg)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px
        }

        .bar {
            height: 8px;
            border-radius: 9px;
            background: var(--line);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            width: 100%;
            background: var(--acc)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .chip {
            border: 1.5px solid var(--c);
            border-radius: 99px;
            padding: 3px 11px;
            font-size: 14px
        }

        .chip b {
            color: var(--c)
        }

        .chip.me {
            background: var(--c);
            color: #fff
        }

        .chip.me b {
            color: #fff
        }

        .pts {
            font-size: 84px;
            color: var(--c)
        }

        pre {
            font: inherit;
            font-size: 20px;
            margin: 0;
            white-space: pre-wrap
        }

        small {
            display: block;
            margin-top: 18px;
            color: var(--mut);
            font-size: 13px
        }

        .qb {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 100%;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 400;
            padding: 14px 18px
        }

        .qb .big {
            font-size: 28px
        }

        #toast {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px));
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s;
            z-index: 5
        }

        #toast.on {
            opacity: 1
        }

        #tm {
            background: var(--fg);
            color: var(--sh);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 100%
        }

        .qb {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .qt {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-start
        }

        .bst {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            white-space: nowrap
        }

        .bst .big {
            font-size: 26px;
            color: var(--acc)
        }

        @keyframes rise {
            from {
                transform: translateY(0) scale(.6);
                opacity: 0
            }

            10% {
                opacity: .35
            }

            to {
                transform: translateY(-115vh) scale(1.1);
                opacity: 0
            }
        }

        @keyframes drop {
            from {
                transform: translateY(-.7em) rotate(-8deg);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @keyframes up {
            from {
                transform: translateY(14px);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        @keyframes pop {
            0% {
                transform: scale(.9);
                opacity: 0
            }

            60% {
                transform: scale(1.025)
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-7px)
            }

            40%,
            80% {
                transform: translateX(7px)
            }
        }

        @keyframes pulse {
            50% {
                opacity: .4
            }
        }

        @keyframes spark {
            to {
                transform: translate(var(--x), var(--y)) scale(.2);
                opacity: 0
            }
        }

        main {
            position: relative;
            z-index: 1
        }

        #bubbles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0
        }

        #bubbles i {
            position: absolute;
            bottom: -40px;
            border-radius: 50%;
            border: 1.5px solid var(--fg);
            opacity: 0;
            animation: rise linear infinite
        }

        h1 span {
            display: inline-block;
            animation: drop .65s cubic-bezier(.2, 1.4, .4, 1) backwards
        }

        .qb {
            animation: up .5s backwards
        }

        .card {
            animation: pop .45s
        }

        .chip {
            animation: up .4s backwards
        }

        .shake {
            animation: shake .35s
        }

        .low i {
            background: var(--t5);
            animation: pulse .5s infinite
        }

        .sp {
            position: fixed;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            animation: spark .9s ease-out forwards
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important
            }

            #bubbles {
                display: none
            }
        }

        #back {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 7;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px 14px;
            background: transparent;
            color: var(--fg);
            font-size: 28px;
            line-height: 1;
            border-radius: 0 0 16px 0
        }

        .playing #back {
            display: block
        }

        .playing main {
            padding-top: 56px
        }

        .ins {
            margin: 0 0 16px;
            padding: 10px 14px;
            border-left: 3px solid var(--acc);
            animation: up .5s .45s backwards
        }

        .ins b {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--mut)
        }

        @media (prefers-reduced-motion:reduce) {
            body {
                transition: none
            }
        }
    </style>
</head>

<body>
    <main id="app"></main>
    <div id="toast" role="status" aria-live="polite"><span id="tm"></span></div>
    <button id="back" aria-label="Leave this dive">←</button>
    <script>
        const PTS = [5, 20, 40, 65, 85, 100],
            TN = ["Crowd favourite", "Common", "Uncommon", "Rare", "Deep cut", "One in an Octillion"],
            MSG = ["Everyone says that one.", "Solid, but plenty of others got there.", "Nice thinking.", "Rare air.", "Deep cut!", "One in an Octillion!"],
            SQ = ["⬜", "🟩", "🟦", "🟪", "🟧", "🟥"],
            RANK = [[0, "Tap-out tourist"], [1200, "Prelim fighter"], [2200, "Contender"], [3200, "Co-main eventer"], [4200, "Champion"], [5200, "Pound-for-pound great"]],
            Q = [
                ["Name a former UFC heavyweight champion", [["Jon Jones", 0, "jones,bones"], ["Francis Ngannou", 0, "ngannou"], ["Stipe Miocic", 0, "miocic,stipe"], ["Brock Lesnar", 0, "lesnar,brock"], ["Cain Velasquez", 1, "velasquez,cain"], ["Daniel Cormier", 1, "cormier,dc"], ["Tom Aspinall", 1, "aspinall"], ["Junior dos Santos", 1, "dos santos,jds,cigano"], ["Randy Couture", 2, "couture"], ["Frank Mir", 2, "mir"], ["Fabricio Werdum", 2, "werdum"], ["Andrei Arlovski", 3, "arlovski"], ["Tim Sylvia", 3, "sylvia"], ["Mark Coleman", 3, "coleman"], ["Josh Barnett", 4, "barnett"], ["Ricco Rodriguez", 4, "ricco"], ["Bas Rutten", 4, "rutten"], ["Maurice Smith", 5, "mo smith"], ["Kevin Randleman", 5, "randleman"]]],
                ["Name a country outside the USA that has hosted a UFC event", [["Canada", 0, ""], ["Brazil", 0, "brasil"], ["United Kingdom", 0, "uk,england,britain,great britain,scotland,northern ireland"], ["Australia", 0, ""], ["Japan", 1, ""], ["United Arab Emirates", 1, "uae,abu dhabi,emirates"], ["Mexico", 1, ""], ["Sweden", 2, ""], ["Germany", 2, ""], ["China", 2, ""], ["Singapore", 2, ""], ["Russia", 2, ""], ["Ireland", 2, ""], ["Poland", 3, ""], ["New Zealand", 3, "nz"], ["South Korea", 3, "korea"], ["France", 3, ""], ["Chile", 4, ""], ["Czech Republic", 4, "czechia,czech"]]],
                ["Name a UFC lightweight champion (undisputed or interim)", [["Conor McGregor", 0, "mcgregor,conor"], ["Khabib Nurmagomedov", 0, "khabib,nurmagomedov"], ["Islam Makhachev", 0, "makhachev,islam"], ["Charles Oliveira", 1, "oliveira,do bronx"], ["Dustin Poirier", 2, "poirier"], ["Justin Gaethje", 2, "gaethje"], ["Tony Ferguson", 2, "ferguson"], ["Frankie Edgar", 2, "edgar"], ["Anthony Pettis", 3, "pettis"], ["Benson Henderson", 3, "henderson,bendo"], ["Rafael dos Anjos", 3, "dos anjos,rda"], ["Eddie Alvarez", 3, "alvarez"], ["BJ Penn", 3, "penn,b.j. penn"], ["Jens Pulver", 4, "pulver"], ["Sean Sherk", 5, "sherk"]]],
                ["Name a Brazilian UFC fighter", [["Anderson Silva", 0, "silva,spider"], ["José Aldo", 0, "aldo"], ["Charles Oliveira", 0, "oliveira"], ["Alex Pereira", 0, "pereira,poatan"], ["Amanda Nunes", 1, "nunes"], ["Vitor Belfort", 1, "belfort"], ["Lyoto Machida", 1, "machida"], ["Maurício Rua", 2, "shogun,shogun rua,rua"], ["Wanderlei Silva", 2, "wanderlei"], ["Minotauro Nogueira", 2, "nogueira,minotauro"], ["Glover Teixeira", 2, "teixeira"], ["Junior dos Santos", 2, "dos santos,jds"], ["Renan Barão", 3, "barao"], ["Deiveson Figueiredo", 3, "figueiredo"], ["Jessica Andrade", 3, "andrade"], ["Paulo Costa", 3, "costa"], ["Edson Barboza", 3, "barboza"], ["Jacaré Souza", 3, "jacare,souza"], ["Jailton Almeida", 4, "almeida"], ["Michel Pereira", 4, "michel"], ["Renato Moicano", 4, "moicano"], ["Gilbert Burns", 2, ""], ["Thiago Santos", 2, ""], ["Rafael dos Anjos", 2, "rda"], ["Fabricio Werdum", 2, ""], ["Marlon Moraes", 3, ""], ["Thiago Alves", 3, ""], ["Demian Maia", 3, ""], ["Raphael Assunção", 3, ""], ["Gabriel Gonzaga", 4, ""], ["Rogério Nogueira", 4, "little nog"], ["Rousimar Palhares", 4, ""], ["Pedro Munhoz", 4, ""], ["Francisco Trinaldo", 4, ""], ["Johnny Walker", 4, ""], ["Viviane Araujo", 4, ""], ["Taila Santos", 4, ""], ["Amanda Ribas", 4, ""], ["Bethe Correia", 4, ""], ["Cláudia Gadelha", 4, ""], ["Ketlen Vieira", 4, ""], ["Mayra Bueno Silva", 4, ""], ["Gleison Tibau", 4, ""], ["Warlley Alves", 5, ""], ["Sérgio Moraes", 5, ""], ["Bruno Silva", 5, ""]]],
                ["Name a UFC women’s champion", [["Ronda Rousey", 0, "rousey"], ["Amanda Nunes", 0, "nunes"], ["Valentina Shevchenko", 0, "shevchenko,valentina"], ["Zhang Weili", 1, "weili,zhang"], ["Rose Namajunas", 1, "namajunas"], ["Joanna Jędrzejczyk", 2, "jedrzejczyk,joanna"], ["Holly Holm", 2, "holm"], ["Miesha Tate", 2, "tate"], ["Cris Cyborg", 2, "cyborg,cris"], ["Julianna Peña", 2, "pena"], ["Alexa Grasso", 2, "grasso"], ["Kayla Harrison", 2, "harrison"], ["Jessica Andrade", 3, "andrade"], ["Carla Esparza", 4, "esparza"], ["Raquel Pennington", 4, "pennington"], ["Germaine de Randamie", 4, "de randamie"], ["Nicco Montaño", 5, "montano"]]],
                ["Name a UFC fighter with a serious wrestling background", [["Khabib Nurmagomedov", 0, "khabib"], ["Daniel Cormier", 0, "cormier,dc"], ["Brock Lesnar", 0, "lesnar"], ["Kamaru Usman", 1, "usman"], ["Henry Cejudo", 1, "cejudo"], ["Colby Covington", 1, "covington"], ["Islam Makhachev", 1, "makhachev"], ["Randy Couture", 2, "couture"], ["Cain Velasquez", 2, "velasquez"], ["Jon Jones", 2, "jones"], ["Chael Sonnen", 3, "sonnen"], ["Ben Askren", 3, "askren"], ["Matt Hughes", 3, "hughes"], ["Johny Hendricks", 3, "hendricks"], ["Mark Coleman", 3, "coleman"], ["Phil Davis", 4, "davis"], ["Dan Severn", 5, "severn"], ["Mark Kerr", 5, "kerr"], ["Josh Koscheck", 3, ""], ["Rashad Evans", 3, ""], ["Tito Ortiz", 3, ""], ["Frankie Edgar", 3, ""], ["Aljamain Sterling", 3, ""], ["Merab Dvalishvili", 3, ""], ["Dan Henderson", 3, ""], ["Yoel Romero", 4, ""], ["Gregor Gillespie", 4, ""], ["Kevin Randleman", 5, "randleman"]]],
                ["Name a fighter Conor McGregor has fought in the UFC", [["Nate Diaz", 0, "diaz"], ["Dustin Poirier", 0, "poirier"], ["Khabib Nurmagomedov", 0, "khabib,nurmagomedov"], ["José Aldo", 0, "aldo"], ["Donald Cerrone", 1, "cerrone,cowboy"], ["Eddie Alvarez", 2, "alvarez"], ["Max Holloway", 2, "holloway"], ["Chad Mendes", 2, "mendes"], ["Dennis Siver", 3, "siver"], ["Diego Brandão", 4, "brandao"], ["Marcus Brimage", 5, "brimage"]]],
                ["Name a submission hold", [["Rear-naked choke", 0, "rnc,rear naked"], ["Armbar", 0, "arm bar,armlock"], ["Guillotine choke", 0, "guillotine"], ["Triangle choke", 0, "triangle"], ["Kimura", 1, ""], ["Heel hook", 1, ""], ["Americana", 2, ""], ["Ankle lock", 2, "achilles lock"], ["D’Arce choke", 2, "darce,d arce"], ["Anaconda choke", 2, "anaconda"], ["Omoplata", 3, ""], ["Kneebar", 3, "knee bar"], ["Arm-triangle choke", 3, "arm triangle,head and arm choke"], ["North-south choke", 4, "north south"], ["Ezekiel choke", 4, "ezekiel"], ["Gogoplata", 4, ""], ["Peruvian necktie", 4, ""], ["Von Flue choke", 5, "von flue"], ["Calf slicer", 5, ""], ["Banana split", 5, ""]]],
                ["Name a former UFC middleweight champion", [["Israel Adesanya", 0, "adesanya,izzy,stylebender"], ["Anderson Silva", 0, "silva,spider"], ["Alex Pereira", 0, "pereira,poatan"], ["Sean Strickland", 1, "strickland"], ["Robert Whittaker", 1, "whittaker"], ["Chris Weidman", 1, "weidman"], ["Dricus du Plessis", 1, "du plessis,dricus"], ["Khamzat Chimaev", 1, "chimaev"], ["Michael Bisping", 2, "bisping"], ["Luke Rockhold", 2, "rockhold"], ["Rich Franklin", 2, "franklin"], ["Evan Tanner", 4, "tanner"], ["Murilo Bustamante", 4, "bustamante"], ["Dave Menne", 5, "menne"]]]
            ];
        const $ = s => document.querySelector(s), app = $("#app"),
            esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])),
            norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, ""),
            fmt = n => n.toLocaleString("en-AU"), NO = ["iceland"];
        function lev(a, b) { const m = [...Array(a.length + 1)].map((_, i) => [i]); for (let j = 1; j <= b.length; j++)m[0][j] = j; for (let i = 1; i <= a.length; i++)for (let j = 1; j <= b.length; j++)m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] == b[j - 1] ? 0 : 1)); return m[a.length][b.length] }
        function match(list, raw) {
            const x = norm(raw); if (!x || NO.includes(x)) return null; let best = null, bd = 9;
            for (const e of list) for (const n of [e[0], ...e[2].split(",")].map(norm).filter(Boolean)) {
                const d = x === n ? 0 : n.length >= 6 ? lev(x, n) : 9, lim = n.length >= 10 ? 2 : 1;
                if (d <= lim && d < bd) { bd = d; best = e }
            }
            return best
        }
        let R, i, score, log, tm, t0, best = 0;
        try { best = +localStorage.getItem("octillion-best") || 0 } catch (e) { }
        function depth() { document.documentElement.style.setProperty("--d", Math.min(1, score / 500)) }
        function home() {
            score = 0; depth();
            app.innerHTML = `<h1>Octillion</h1>
 <p class="big mut" style="margin-top:10px">UFC trivia where the obvious answer is worth almost nothing.</p>
 <div class="card"><p>You get seven prompts and 25 seconds for each. Every prompt has lots of right answers, but the ones everybody says barely score. Name the deep cut and you earn up to 100 points.</p>
 <div class="chips">${TN.map((t, k) => `<span class="chip" style="--c:var(--t${k})"><b>${PTS[k]}</b> ${t}</span>`).join("")}</div>
 <p class="mut" style="margin:12px 0 0">Every point is 10 metres of depth, and the water gets darker as you sink. A perfect dive is 7,000 m.${best ? ` Your best is ${fmt(best)} m.` : ""}</p></div>
 <button id="go">Start the dive</button>
 <small>A fan-made game, not affiliated with the UFC or Krillion. Rarity comes from a built-in answer bank rather than live player data, so answers outside the bank score 0.</small>`;
            $("#go").onclick = go
        }
        function go() { R = [...Q].sort(() => Math.random() - .5).slice(0, 7); i = 0; score = 0; log = []; ask() }
        function head() { return `<div class="top"><span class="mut">Prompt ${i + 1} of 7</span><span class="big">${fmt(score * 10)} m</span></div>` }
        function ask() {
            app.innerHTML = `${head()}<div class="bar"><i id="tb"></i></div><div class="card"><div class="mut"><span id="tl">25</span> seconds left</div><h2>${R[i][0]}</h2>
 <input id="in" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Type one answer" aria-label="Your answer"><div class="row"><button id="lk">Lock it in</button></div></div>`;
            const inp = $("#in"); inp.focus(); $("#lk").onclick = lock; inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!e.repeat) lock() } };
            t0 = Date.now(); clearInterval(tm);
            tm = setInterval(() => { const l = 25 - (Date.now() - t0) / 1000; $("#tb").style.width = Math.max(0, l * 4) + "%"; $("#tl").textContent = Math.max(0, Math.ceil(l)); if (l <= 0) lock() }, 100)
        }
        function lock() {
            clearInterval(tm); const q = R[i], raw = $("#in").value.trim(), m = match(q[1], raw), p = m ? PTS[m[1]] : 0;
            score += p; log.push(m ? m[1] : -1); depth(); reveal(q, raw, m, p)
        }
        function reveal(q, raw, m, p) {
